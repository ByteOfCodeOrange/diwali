<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Diwali from Shreeya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --night:#14061f; --plum:#2a0b3a; --gold:#f5c96a; --gold-deep:#b9771f; --ember:#ff8a2a; --rose:#ff5d7a; --ivory:#fff3dc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 55%, #3b1050 0%, var(--plum) 35%, var(--night) 75%);
  color:var(--ivory); overflow:hidden; font-family:"Cormorant Garamond",Georgia,serif;
  -webkit-tap-highlight-color:transparent; cursor:pointer;
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#mandala{position:fixed;left:50%;top:46%;width:min(120vw,900px);aspect-ratio:1;transform:translate(-50%,-50%);opacity:.0;animation:fadeIn 3s .2s forwards;pointer-events:none}
#mandala g{transform-origin:450px 450px}
#m1{animation:spin 140s linear infinite}
#m2{animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{to{opacity:.55}}
.stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 90px}
.sanskrit{font-family:"Tiro Devanagari Hindi",serif;font-size:clamp(1.1rem,3.4vw,1.7rem);color:var(--gold);letter-spacing:.12em;opacity:0;animation:rise 1.6s 3.4s forwards}
h1{margin:.15em 0 0;font-weight:700;font-size:clamp(3.4rem,16vw,10.5rem);line-height:.95;letter-spacing:.01em}
h1 .w{display:block}
h1 .l{display:inline-block;opacity:0;filter:blur(18px);transform:translateY(40px) scale(1.15);
  background:linear-gradient(180deg,#fff6d8 0%,var(--gold) 45%,var(--gold-deep) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:letter 1.5s cubic-bezier(.2,.7,.2,1) forwards;
  filter:blur(18px) drop-shadow(0 0 18px rgba(255,170,60,.35))}
@keyframes letter{to{opacity:1;filter:blur(0) drop-shadow(0 0 18px rgba(255,170,60,.35));transform:none}}
.from{margin-top:1.1rem;font-style:italic;font-weight:500;font-size:clamp(1.5rem,5vw,2.6rem);color:var(--ivory);opacity:0;animation:rise 1.8s 4.6s forwards}
.from b{font-weight:700;font-style:italic;color:var(--rose);text-shadow:0 0 24px rgba(255,93,122,.55)}
.rule{width:0;height:1px;margin:1.2rem auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 2s 3.2s forwards}
@keyframes grow{to{width:min(60vw,360px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.diyas{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;justify-content:center;align-items:flex-end;gap:clamp(6px,3vw,26px);pointer-events:none}
.diya{width:clamp(34px,9vw,74px);position:relative}
.diya.big{width:clamp(48px,13vw,104px)}
.diya svg{display:block;width:100%;overflow:visible}
.flame{transform-origin:50% 100%;transform:scale(0);opacity:0}
.diya.lit .flame{opacity:1;animation:ignite .9s forwards,flicker 1.7s .9s ease-in-out infinite}
.glow{opacity:0;transition:opacity 1.6s}
.diya.lit .glow{opacity:1}
@keyframes ignite{to{transform:scale(1)}}
@keyframes flicker{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.94,1.06) skewX(-3deg)}45%{transform:scale(1.04,.96) skewX(2deg)}70%{transform:scale(.97,1.04) skewX(-2deg)}}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;z-index:3;font-size:1rem;color:rgba(255,243,220,.55);opacity:0;animation:rise 1.5s 6s forwards;font-style:italic}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s!important;animation-delay:0s!important}
  #m1,#m2{animation:none!important}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<svg id="mandala" viewBox="0 0 900 900" aria-hidden="true">
  <defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5c96a"/><stop offset="1" stop-color="#ff8a2a"/></linearGradient></defs>
  <g id="m1" fill="none" stroke="url(#gl)" stroke-width="1.2"></g>
  <g id="m2" fill="none" stroke="url(#gl)" stroke-width="1"></g>
</svg>

<main class="stage">
  <div class="sanskrit">शुभ दीपावली</div>
  <h1 aria-label="Happy Diwali"><span class="w" id="w1"></span><span class="w" id="w2"></span></h1>
  <div class="rule"></div>
  <div class="from">from <b>Shreeya</b></div>
</main>

<div class="hint">Tap anywhere for fireworks</div>
<div class="diyas" id="diyas" aria-hidden="true"></div>

<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

  /* Title letters */
  function letters(id,txt,start){var h=document.getElementById(id);txt.split("").forEach(function(c,i){var s=document.createElement("span");s.className="l";s.textContent=c;s.style.animationDelay=(start+i*.11)+"s";h.appendChild(s)})}
  letters("w1","Happy",0.8); letters("w2","Diwali",1.5);

  /* Mandala */
  var m1=document.getElementById("m1"),m2=document.getElementById("m2");
  function petals(g,n,r,len,wid){for(var i=0;i<n;i++){var a=i*360/n;var d="M450,"+(450-r)+" C"+(450+wid)+","+(450-r-len*.4)+" "+(450+wid*.5)+","+(450-r-len*.8)+" 450,"+(450-r-len)+" C"+(450-wid*.5)+","+(450-r-len*.8)+" "+(450-wid)+","+(450-r-len*.4)+" 450,"+(450-r);el("path",{d:d,transform:"rotate("+a+" 450 450)"},g)}}
  [90,150,215,290,370].forEach(function(r){el("circle",{cx:450,cy:450,r:r,"stroke-dasharray":r>200?"2 8":"none"},m1)});
  petals(m1,12,60,90,34); petals(m1,24,215,70,22); petals(m1,36,300,60,16);
  petals(m2,16,130,80,26); petals(m2,18,240,95,30);
  for(var i=0;i<48;i++){var a=i*7.5*Math.PI/180;el("circle",{cx:450+Math.cos(a)*400,cy:450+Math.sin(a)*400,r:2.6},m2)}

  /* Diyas */
  var row=document.getElementById("diyas"),N=7,mid=3,items=[];
  function diya(big){
    var d=document.createElement("div");d.className="diya"+(big?" big":"");
    d.innerHTML='<svg viewBox="0 0 100 80"><defs><linearGradient id="b'+(big?1:0)+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd98a"/><stop offset=".5" stop-color="#d98a22"/><stop offset="1" stop-color="#7a3f0c"/></linearGradient><radialGradient id="g'+(big?1:0)+'"><stop offset="0" stop-color="#ffb347" stop-opacity=".85"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/></radialGradient><linearGradient id="f'+(big?1:0)+'" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff6a1a"/><stop offset=".6" stop-color="#ffc13b"/><stop offset="1" stop-color="#fff6c8"/></linearGradient></defs>'+
    '<circle class="glow" cx="50" cy="30" r="48" fill="url(#g'+(big?1:0)+')"/>'+
    '<path d="M8 38 Q50 36 92 38 Q88 70 50 74 Q12 70 8 38Z" fill="url(#b'+(big?1:0)+')"/>'+
    '<path d="M8 38 Q50 44 92 38" fill="none" stroke="#ffe7ae" stroke-width="1.6" opacity=".8"/>'+
    '<path d="M44 76 H56 L60 80 H40Z" fill="#7a3f0c"/>'+
    '<path class="flame" d="M50 36 C38 24 44 12 50 0 C56 12 62 24 50 36Z" fill="url(#f'+(big?1:0)+')"/>';
    row.appendChild(d);return d;
  }
  for(var i=0;i<N;i++)items.push(diya(i===mid));
  var order=[mid,mid-1,mid+1,mid-2,mid+2,mid-3,mid+3];
  order.forEach(function(ix,k){setTimeout(function(){items[ix].classList.add("lit")},300+k*420)});

  /* Fireworks + embers */
  var cv=document.getElementById("fx"),cx=cv.getContext("2d"),W,H,dpr=Math.min(window.devicePixelRatio||1,2);
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
  size();addEventListener("resize",size);
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  var cols=["#f5c96a","#ffb347","#ff8a2a","#ff5d7a","#fff3dc","#ffd98a"];
  var parts=[],embers=[];
  for(var i=0;i<46;i++)embers.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.15,p:Math.random()*6});
  function burst(x,y){
    var c=cols[Math.random()*cols.length|0],c2=cols[Math.random()*cols.length|0],n=reduce?18:70+(Math.random()*30|0);
    for(var i=0;i<n;i++){var a=Math.PI*2*i/n,s=Math.random()*3.2+1.6;
      parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,d:Math.random()*.008+.008,c:i%3?c:c2,r:Math.random()*1.5+1})}
  }
  function launch(x,y){burst(x==null?W*(.15+Math.random()*.7):x,y==null?H*(.12+Math.random()*.4):y)}
  addEventListener("pointerdown",function(e){launch(e.clientX,e.clientY)});
  var t0=performance.now(),next=2500;
  function frame(t){
    cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.18)";cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation="lighter";
    embers.forEach(function(e){e.y-=e.v;e.x+=Math.sin(t/1800+e.p)*.25;if(e.y<-5){e.y=H+5;e.x=Math.random()*W}
      cx.beginPath();cx.fillStyle="rgba(255,176,70,"+(.25+.25*Math.sin(t/600+e.p))+")";cx.arc(e.x,e.y,e.r,0,7);cx.fill()});
    for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.vx*=.985;p.vy=p.vy*.985+.035;p.x+=p.vx;p.y+=p.vy;p.life-=p.d;
      if(p.life<=0){parts.splice(i,1);continue}
      cx.beginPath();cx.fillStyle=p.c;cx.globalAlpha=Math.max(p.life,0);cx.arc(p.x,p.y,p.r,0,7);cx.fill();cx.globalAlpha=1}
    if(t-t0>next){launch();next=t-t0+1500+Math.random()*1400}
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
